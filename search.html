<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owly - Book Search App</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="./src/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="logo-container">
      <img src="/logo.png" alt="Owly Logo" class="app-logo" />
      <p class="app-tagline">Owly - Book Search App</p>
    </div>
    <nav class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="search.html" class="nav-link active">Library Search</a>
      <a href="wishlist.html" id="wishlist-nav-link" class="nav-link">Saved Books</a>
      <a href="levels.html" class="nav-link">Book Journey</a>
    </nav>
  </header>

  <main class="container">
    <!-- Search Section Card -->
    <section class="search-section">
      <h2>Search Books by Category</h2>
      
      <div class="search-box">
        <input 
          type="text" 
          id="category-input" 
          placeholder="Enter category (e.g. fantasy, science, history)..." 
          aria-label="Book category"
          autocomplete="off"
        />
        <button id="search-btn" class="btn primary-btn">Search</button>
      </div>

      <!-- Category Search Legend Card (Nested Inside) -->
      <div class="category-legend-card">
        <h3>🏷️ Explore Popular Categories</h3>
        <p class="legend-help-text">Click a category tag or type a topic above to search Open Library subject indices.</p>
        
        <div class="category-chips">
          <button type="button" class="chip-btn" data-category="fiction">📖 Fiction</button>
          <button type="button" class="chip-btn" data-category="science_fiction">🚀 Sci-Fi</button>
          <button type="button" class="chip-btn" data-category="fantasy">🧙 Fantasy</button>
          <button type="button" class="chip-btn" data-category="history">🏛️ History</button>
          <button type="button" class="chip-btn" data-category="biography">👤 Biography</button>
          <button type="button" class="chip-btn" data-category="science">🔬 Science</button>
          <button type="button" class="chip-btn" data-category="art">🎨 Art</button>
          <button type="button" class="chip-btn" data-category="cooking">🍳 Cooking</button>
        </div>
      </div>
    </section>

    <!-- Status & Loading message displayed inside the card -->
    <div id="status-message" class="status-message"></div>

    <!-- Results Grid -->
    <section class="results-section">
      <div id="books-list" class="books-grid"></div>
      
      <!-- Load More Button -->
      <div class="load-more-container" style="text-align: center; margin-top: 2rem;">
        <button id="load-more-btn" class="cta-button hidden">Load More Books</button>
      </div>
    </section>

    <!-- Details Modal -->
    <div id="details-modal" class="modal hidden">
      <div class="modal-content">
        <button id="close-modal" class="close-btn">&times;</button>
        <h3 id="modal-title"></h3>
        <p id="modal-authors" class="authors"></p>
        <hr />
        <p id="modal-description" class="description"></p>
      </div>
    </div>
  </main>

  <script type="module" src="/src/js/search.js"></script>
</body>
</html>
